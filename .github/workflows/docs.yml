# 매뉴얼 공개 배포 — packages/vscode/media/help.md 하나가 정본이다.
#
# ■ 왜 파일 하나인가
#   같은 글을 두 벌 두면 갈린다. 여기서 나가는 웹 문서와 VSIX 안 동봉본은 **같은 파일**에서
#   나온다. 웹은 언제든 고쳐 내보낼 수 있고(확장 릴리스와 무관), 동봉본은 인터넷이 끊긴
#   자리를 위한 폴백이다.
#
# ■ 왜 Jekyll 인가
#   레포에 의존성을 안 늘린다. 마크다운 렌더러를 devDependency 로 들이면 확장 빌드와 문서
#   빌드가 같은 lockfile 을 나눠 쓰게 되고, 문서 때문에 확장이 깨지는 날이 온다.
#
# ■ 켜기 (한 번만, 웹 콘솔)
#   Settings → Pages → Build and deployment → Source: **GitHub Actions**
#   그 전까지 이 워크플로는 deploy 단계에서 실패한다(빌드까지는 돈다).
name: docs

on:
  push:
    branches: [main]
    paths:
      - "packages/vscode/media/help.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 한 번에 하나만 — 나중에 민 것이 이긴다. 문서는 최신이 정답이다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 사이트 조립
        run: |
          set -euo pipefail
          src=packages/vscode/media/help.md
          test -s "$src"   # 빈 파일이 조용히 배포되지 않게
          mkdir -p site

          cat > site/_config.yml <<'YAML'
          title: 잘커라 도움말
          description: 잘커라 VS Code 확장 사용 설명서
          theme: minima
          lang: ko
          YAML

          # 머리말(front matter)을 얹어 레이아웃을 태운다. 원본 파일은 손대지 않는다 —
          # 편집기에서 그대로 읽히는 것이 정본의 조건이다.
          {
            echo '---'
            echo 'layout: page'
            echo 'title: 잘커라 도움말'
            echo '---'
            echo
            # 첫 줄 `# 잘커라 도움말` 은 레이아웃 제목과 겹치므로 뺀다.
            tail -n +2 "$src"
          } > site/index.md

          grep -q '새 버전 올리기' site/index.md   # tail 이 본문을 자르지 않았는지

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
