# 매뉴얼 공개 배포 — packages/vscode/media/help.md 하나가 정본이다.
#
# ■ 왜 파일 하나인가
#   같은 글을 두 벌 두면 갈린다. 여기서 나가는 웹 문서와 VSIX 안 동봉본은 **같은 파일**에서
#   나온다. 웹은 언제든 고쳐 내보낼 수 있고(확장 릴리스와 무관), 동봉본은 인터넷이 끊긴
#   자리를 위한 폴백이다.
#
# ■ 왜 Jekyll 인가
#   레포에 의존성을 안 늘린다. 마크다운 렌더러를 devDependency 로 들이면 확장 빌드와 문서
#   빌드가 같은 lockfile 을 나눠 쓰게 되고, 문서 때문에 확장이 깨지는 날이 온다.
#
# ■ Pages 켜기 — **손으로 한 번 켜야 했다**(실측)
#   `enablement: true` 를 줬는데도 워크플로 토큰으로는 못 켰다(31368435292 실패, `has_pages` 그대로 false).
#   결국 오너가 Settings → Pages → Source: **GitHub Actions** 를 눌러서 켰다(2026-08-10).
#   옵션은 남긴다 — 켜진 뒤에는 무해하고(멱등), 레포를 새로 파는 날 한 번은 스스로 될 수도 있다.
#
#   ⚠ **여기서 두 번 틀렸다.** 처음엔 "deploy 단계에서만 실패한다"고 적었는데 `configure-pages` 는
#   build 잡이라 빌드도 못 갔다. 다음엔 "스스로 켠다"고 적었는데 안 켜졌다. 둘 다 **해 보기 전에
#   적은 말**이었다 — 이 파일의 주석은 실행 결과만 적는다.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "packages/vscode/media/help.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 한 번에 하나만 — 나중에 민 것이 이긴다. 문서는 최신이 정답이다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 사이트 조립
        run: |
          set -euo pipefail
          src=packages/vscode/media/help.md
          # 빈 파일이 조용히 배포되지 않게 — 그리고 **쪼그라든 것도** 배포되지 않게.
          # 바닥은 지문이 아니라 하한이다(실측 496줄). 문면을 못으로 박으면 이름을 다듬을
          # 때마다 CI 가 깨진다 — 종전 판이 그랬다.
          test -s "$src"
          test "$(wc -l < "$src")" -ge 300 || { echo "도움말이 너무 짧습니다: $(wc -l < "$src")줄"; exit 1; }
          mkdir -p site

          cat > site/_config.yml <<'YAML'
          title: 잘커라 도움말
          description: 잘커라 VS Code 확장 사용 설명서
          theme: minima
          lang: ko
          YAML

          # 머리말(front matter)을 얹어 레이아웃을 태운다. 원본 파일은 손대지 않는다 —
          # 편집기에서 그대로 읽히는 것이 정본의 조건이다.
          {
            echo '---'
            echo 'layout: page'
            echo 'title: 잘커라 도움말'
            echo '---'
            echo
            # 첫 줄 `# 잘커라 도움말` 은 레이아웃 제목과 겹치므로 뺀다.
            tail -n +2 "$src"
          } > site/index.md

          # 본문이 잘리지 않았는가 — **문면이 아니라 줄 수로 잰다.**
          # 종전에는 제품 라벨(「새 버전 올리기」)을 못으로 박아, 이름을 다듬을 때마다 CI 가
          # 깨졌다. 여기서 재려던 것은 `tail` 이 본문을 삼켰는지이지 그 낱말이 남아 있는지가
          # 아니다. 머리말 4줄 + 빈 줄 1줄 − `tail -n +2` 가 뗀 1줄 = +4.
          want=$(( $(wc -l < "$src") + 4 ))
          got=$(wc -l < site/index.md)
          test "$got" -eq "$want" || { echo "본문이 잘렸습니다: $got 줄(기대 $want)"; exit 1; }

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
