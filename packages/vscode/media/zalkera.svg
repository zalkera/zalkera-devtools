<!-- 활동 표시줄 아이콘.
     ■ 제약: **단색 라인아트**여야 한다. VS Code 가 currentColor 로 덧칠하므로 브랜드 초록·주황이
       들어가지 않고, 활동 표시줄의 이웃 아이콘들이 전부 얇은 선이라 꽉 찬 심볼은 튄다.
     ■ 실측(24px 렌더 비교): 브랜드 심볼(잎 4 + 씨앗)을 그대로 실루엣으로 쓰면 **덩어리로 뭉갠다**.
       모양 수를 줄이고 선으로 그린 새싹이 24px 에서 유일하게 또렷했다.
     ■ 뜻은 유지한다 — 잘커라(자라라)의 새싹. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 20V9"/>
  <path d="M12 13c0-3.6 2.8-6 6.5-6 0 3.6-2.8 6-6.5 6z"/>
  <path d="M12 9C12 5.5 9 3 5.2 3 5.2 6.5 8.2 9 12 9z"/>
</svg>
